<!DOCTYPE html>
<html>
    <head>
        <title></title>

        <style>
            #dv{
                width: 50%;
                height: 100px;
                background-color: aqua;
                font-size: 30px;
            }
            #out{
                font-size: 2em;
            }
            #in{
                font-size: 2em;
            }
            /*
            percentages - gets that percentage from parent
            vh, vw - view height, view width 
                     1 percent from the entire screen
            rem - 1 rem = root font size
            em - 1 em = parent font size

            */
        </style>
    </head>

    <body>
        <p id="out">Hello</p>
        <div id="dv">
            <p id="in">Hello</p>
        </div>
    </body>
</html>
