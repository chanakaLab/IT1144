<!DOCTYPE html>
<html>
    <head>
        <title></title>

        <style>
            body{
                display: flex;
                min-height: 800px;
                border: red 4px solid;

                justify-content: space-evenly;
                align-items: flex-start;
                align-content: center;
            }

            #box1{
                align-self: center;
                margin-right: auto;
            }

            .boxes{
                display: flex;
                align-items: center;
                justify-content: center;

                width: 50px;
                height: 50px;
                background-color: rgb(14, 235, 224);
            }

            /*
            any parent element can be a flex box

            justify-content: ; - aligns in horizontal axis
            flex-start - align left
            flex-end - align right
            space-between - distributes elements keeping dividing space between elements evenly, last and first element touches the border
            space-around - same as space between but first and last element doesn't touch borders. space between border and first, last elements is half of the space between elements
            
            space-evenly - devides all spaces between border,element and element, element evenly

            center



            align-items: ; - aligns in vertical axis
            same values as above justify-content controls y axis individually in elements

            align-content: ;
            same values as justify-content
            controls y axis all together



            flex-direction: ;
            row
            row-reverse
            column
            column-reverse

            gap: ;
            column-gap: ;
            row-gap: ;
               in pixels or any other unit


            flex-wrap: ;
            wrap - items will jump to next lines when
                    resizing if there is no enough space
            nowrap - items shrink

            flex-shrink: ;
            flex-grow: ;
            0 - off 
            1 - on
            above one will act as multiplier relatively others
            min-width: ; - min width to shrink
            max-width: ; - max width to grow

            margin-right: ;
            margin-left: ;
                if applied for a one it isolates from
                others

            */

        </style>

    </head>

    <body>
        <div id="box1" class="boxes">1</div>
        <div class="boxes">2</div>
        <div class="boxes">3</div>
        <div class="boxes">4</div>
        <div class="boxes">5</div>
        <div class="boxes">6</div>
        
    </body>
</html>
