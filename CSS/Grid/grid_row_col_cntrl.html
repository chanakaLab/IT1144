<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page title</title>
    
    <style>
        #container{
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
        }
        
        .items{
            
        }
        #b1{
            background-color: blue;
            grid-column: 1/3;
            grid-row: 1/2;
            opacity: 50%;
        }
        #b2{
            background-color: pink;
            grid-column: 2/4;
            grid-row: 1/2;
        }
        
        /* grid-colum:; controls how much should elements expand. value that are entered are line numbers. 1/3 means start at line 1 and end at line 3.
        
        another way to stack - 
        
        #container{
          display: flex;
          grid-template-areaa: "stack";  
        }
        
        #item1{
            grid-area: stack;
        }
        
        #item2{
            grid-area: stack;
        }
        
        place-items: center;
        
        z-index:;
        index at z axis
        
        */

        
    </style>
    
</head>
<body>
    <div id="container">
        <div class="items" id="b1" >1</div>
        <div class="items" id="b2">2</div>
        
    </div>
</body>
</html>
