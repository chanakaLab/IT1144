<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page title</title>
    <style>
       #container{
           height: 500px;
           border: solid 1px black;
           display: grid;
           grid-template-columns: 100px 100px 100px;
           grid-template-rows: 100px 100px 100px;
           justify-items: center;
           align-items: center;
           
           justify-content: center;
           align-content: center;
           
           
           gap: 10px;
       }
       
       .items{
           width: 50px;
           height: 50px;
           background-color: blue;
       }
       
       
       /*
       justify-items:;
       align-items:;
           values => start, end, center
         aligns items in grid cell
         
       justify-content:;
       align-content:;
           values => same as above
         aligns entire grid in the container
    
       grid-auto-rows:;
       grid-auto-columns:;
           adjusts column and row size outside
           grid-template-columns:; and 
           grid-template-rows:;. like auto
           genarated items by javascript
       
       grid-auto-flow:;
           values => column, row
           controls column row flow

       */
       
    </style>
</head>
<body>
    <div id="container">
        <div class="items">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items">5</div>
        <div class="items">6</div>
        <div class="items">7</div>
        <div class="items">8</div>
        <div class="items">9</div>
    </div>
</body>
</html>
