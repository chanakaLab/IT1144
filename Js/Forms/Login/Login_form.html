<!DOCTYPE html>

<html>
    <head>
        <title>Test</title>
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="test.css">
        <style>
            
            body{
                background-image: url("back.jpg");
                background-size: cover;
                background-attachment: fixed;
                
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .cont{
                width: 350px;
                height: 500px;
                background-color: transparent;
                backdrop-filter: blur(5px);
                border-radius: 20px;
                border: 1px solid white;
                color: white;
                
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                gap: 10px;
                
            }
            .lgn{
                margin: 0;
                padding: 0;
                font-size: 3em;
            }
            .sub{
                font-size: 0.9em;
                margin: 0;
                padding: 0;
            }
            
            .inps{
                width: 260px;
                height: 35px;
                font-size: 1em;
                border: 1px solid black;
                border-radius: 5px;
                background-color: rgba(250, 250, 250, 0.2);
            }
            .inps::placeholder{
                color: white;
                margin-left: 5px;
            }
            .btn{
                width: 120px;
                height: 30px;
                border-radius: 5px;
                border: 0;
                font-size: 1em;
                background-color: #15b6ff;
                transition: font-size 0.4s ease 0s, background-color 0.4s ease 0s;
            }
            .btn:active{
                font-size: 0.9em;
                background-color: #1577ff;
            }
            
        </style>
    </head>
    
    <body>
        
         <div class="cont">
             
             <h1 class="lgn">Login</h1>
             <h5 class="sub">To make your life Easier and comfortable</h5>
             <input type="text" class="inps" placeholder="Username">
             <input type="password" class="inps" placeholder="Password">
             <label class="rmbr">
                 <input type="checkbox"> Remember me
             </label>
             
             <button class="btn">Login</button>
             
         </div>   
         
    </body>
    
    
</html>
